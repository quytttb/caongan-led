name: Dev Build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: dev-build-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Chạy thủ công thì build/test lại chính ref được chọn. Với push thông thường,
  # dùng kết quả CI đã chạy để không build và test hai lần.
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Windows and Linux dev artifacts
    needs: checks
    if: >-
      ${{ always() && (
        (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SOURCE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
    steps:
      - name: Download tested Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: caongan-led-windows-${{ env.BUILD_SHA }}
          path: dev-assets
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Download tested Linux package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: caongan-led-linux-${{ env.BUILD_SHA }}
          path: dev-assets
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Verify checksum and record provenance
        shell: bash
        run: |
          set -euo pipefail
          cd dev-assets
          shopt -s nullglob
          for pattern in 'caongan-led-*-win-x64.zip.sha256' 'caongan-led-*-win-x64.msi.sha256' 'caongan-led_*_amd64.deb.sha256'; do
            checksums=( $pattern )
            if [[ ${#checksums[@]} -ne 1 ]]; then
              echo "Expected exactly one checksum for $pattern." >&2
              exit 1
            fi
            sha256sum --check --strict "${checksums[0]}"
          done
          {
            echo 'Development package for testing only; not approved for production.'
            echo "Source commit: $BUILD_SHA"
            echo "Source checks run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
            echo 'Windows binary: CMake Release configuration.'
          } > DEV-BUILD-INFO.txt

      - name: Upload Windows dev build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: caongan-led-dev-windows-${{ env.BUILD_SHA }}
          path: |
            dev-assets/*.zip
            dev-assets/*.zip.sha256
            dev-assets/*.msi
            dev-assets/*.msi.sha256
            dev-assets/DEV-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload Linux dev build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: caongan-led-dev-linux-${{ env.BUILD_SHA }}
          path: |
            dev-assets/*.deb
            dev-assets/*.deb.sha256
            dev-assets/DEV-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 3
