name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: 'Commit to build and test; defaults to the triggering commit.'
        type: string
        required: false
      build_version:
        description: 'Optional application version for a release build.'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b

jobs:
  linux:
    name: Linux — build, test, lint, smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          ref: ${{ inputs.source_sha || github.sha }}

      # Packaging tools come from the workflow commit, while application code
      # remains at source_sha. This also packages an existing older release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .package-tools

      - name: Read Qt version
        id: qt
        run: echo "version=$(tr -d '[:space:]' < packaging/qt_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Install build and Qt platform dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libfontconfig1-dev libdbus-1-dev \
            libxkbcommon-dev libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            patchelf dpkg-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ steps.qt.outputs.version }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          install-deps: false
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: caongan-qt${{ steps.qt.outputs.version }}-linux

      - name: Configure
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        shell: bash
        run: |
          set -euo pipefail
          args=(-S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
                "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" -DCAONGAN_BUILD_TESTS=ON)
          if [[ -n "$BUILD_VERSION" ]]; then
            args+=("-DCAONGAN_BUILD_VERSION=$BUILD_VERSION")
          fi
          cmake "${args[@]}"
          if [[ -n "$BUILD_VERSION" ]]; then
            grep -Fxq "CMAKE_PROJECT_VERSION:STATIC=$BUILD_VERSION" build-ci/CMakeCache.txt || {
              echo 'Configured version does not match the release tag.' >&2
              exit 1
            }
          fi

      - name: Build
        run: cmake --build build-ci --parallel 4

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

      - name: QML lint (unqualified accesses tracked separately)
        run: >-
          "$QT_ROOT_DIR/bin/qmllint" --unqualified disable -W 0
          -I build-ci -I build-ci/CaonganLed/App src/app/qml/*.qml

      - name: Offscreen QML smoke
        shell: bash
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen QT_FATAL_WARNINGS=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/caongan-xdg"
          export CAONGAN_LED_BASE_DIR="$RUNNER_TEMP/caongan-led-smoke"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          set +e
          timeout 6s ./build-ci/caongan_led --preview --simulate --scenario 'Sai đơn vị' > "$RUNNER_TEMP/smoke.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/smoke.log"
          if [[ "$result" -ne 124 ]] || ! grep -Fq 'config =' "$RUNNER_TEMP/smoke.log"; then
            echo 'Smoke test did not reach readiness and remain running.' >&2
            exit 1
          fi

      - name: Read built version
        if: ${{ github.event_name != 'pull_request' }}
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' build-ci/CMakeCache.txt)
          [[ -n "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build DEB
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          CAONGAN_SOURCE_DIR: ${{ github.workspace }}
          CAONGAN_PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          CAONGAN_PACKAGE_BUILD_DIR: ${{ runner.temp }}/caongan-deb-build
          CAONGAN_PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/dist
        run: bash .package-tools/packaging/linux/build-deb.sh

      - name: Test DEB without build Qt on PATH
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: >-
          bash .package-tools/packaging/linux/smoke-deb.sh
          "$GITHUB_WORKSPACE/dist/caongan-led_${{ steps.version.outputs.version }}_amd64.deb"
          "$RUNNER_TEMP/caongan-deb-smoke"
          '${{ steps.version.outputs.version }}'

      - name: Install and uninstall DEB on clean Ubuntu 24.04
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/dist:/packages:ro" \
            -e PACKAGE_VERSION -e DEBIAN_FRONTEND=noninteractive ubuntu:24.04 bash -euc '
              apt-get update -qq
              apt-get install -y --no-install-recommends "/packages/caongan-led_${PACKAGE_VERSION}_amd64.deb" \
                xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0
              mkdir -m 700 -p /tmp/caongan-xdg /tmp/caongan-home
              export HOME=/tmp/caongan-home LANG=C.UTF-8 XDG_RUNTIME_DIR=/tmp/caongan-xdg
              export CAONGAN_LED_BASE_DIR=/tmp/caongan-home/app-data
              export QT_QPA_PLATFORM=offscreen QT_FATAL_WARNINGS=1
              test "$(caongan-led --version)" = "CaonganLed $PACKAGE_VERSION"
              caongan-led --preview --verify-preview-windows
              test -f /tmp/caongan-home/app-data/data/snapshot.db
              unset QT_QPA_PLATFORM QT_FATAL_WARNINGS
              export CAONGAN_LED_BASE_DIR=/tmp/caongan-home/simulation-data
              timeout 45s xvfb-run -a -s "-screen 0 1920x1200x24" \
                caongan-led --preview --simulate --verify-preview-windows > /tmp/xcb.log 2>&1
              grep -q PREVIEW_WINDOWS_OK /tmp/xcb.log
              test -f /tmp/caongan-home/app-data/data/snapshot.db
              apt-get remove -y caongan-led
              test ! -e /opt/caongan-led/bin/caongan_led
              test -f /tmp/caongan-home/app-data/data/snapshot.db
            '

      - name: Upload Linux test artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: caongan-led-linux-${{ inputs.source_sha || github.sha }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 — build, test, package, smoke
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .package-tools

      - name: Read Qt version
        id: qt
        shell: pwsh
        run: |
          $version = (Get-Content packaging/qt_version.txt -Raw).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ steps.qt.outputs.version }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.temp }}
          install-deps: false
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: caongan-qt${{ steps.qt.outputs.version }}-win-msvc2022

      - name: Build and CTest
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Khong tim thay vswhere.' }
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Khong tim thay Visual Studio 2022 va MSVC x64.' }
          $devShell = Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll'
          if (-not (Test-Path $devShell)) { throw 'Khong tim thay Visual Studio DevShell.' }
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'Khong tim thay compiler MSVC.' }
          ./packaging/windows/build.ps1 -QtRoot $env:QT_ROOT_DIR -Version $env:BUILD_VERSION

      - name: Read built version
        if: ${{ github.event_name != 'pull_request' }}
        id: version
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          $line = Select-String -Path build/windows-release/CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(\d+\.\d+\.\d+)$' | Select-Object -First 1
          if (-not $line) { throw 'CMake project version not found' }
          $version = $line.Matches[0].Groups[1].Value
          if ($env:BUILD_VERSION -and $version -ne $env:BUILD_VERSION) { throw 'Build version does not match release tag.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Deploy and checksum
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: ./packaging/windows/deploy.ps1 -QtRoot $env:QT_ROOT_DIR -Version '${{ steps.version.outputs.version }}'

      - name: Test deployed package without Qt on PATH
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: >-
          ./.package-tools/packaging/windows/smoke.ps1
          -PackageDir "${{ github.workspace }}/dist/caongan-led-${{ steps.version.outputs.version }}-win-x64"
          -ScratchDir "$env:RUNNER_TEMP/caongan-led-package-smoke"

      - name: Build MSI
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: >-
          ./.package-tools/packaging/windows/build-msi.ps1
          -PackageDir "${{ github.workspace }}/dist/caongan-led-${{ steps.version.outputs.version }}-win-x64"
          -OutputDir "${{ github.workspace }}/dist"
          -BuildDir "$env:RUNNER_TEMP/caongan-msi-build"
          -Version '${{ steps.version.outputs.version }}'

      - name: Install and uninstall MSI on isolated Windows runner
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: >-
          ./.package-tools/packaging/windows/smoke-msi.ps1
          -MsiPath "${{ github.workspace }}/dist/caongan-led-${{ steps.version.outputs.version }}-win-x64.msi"
          -ScratchDir "$env:RUNNER_TEMP/caongan-msi-smoke"
          -PackageSmokeScript "${{ github.workspace }}/.package-tools/packaging/windows/smoke.ps1"

      - name: Upload Windows test artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: caongan-led-windows-${{ inputs.source_sha || github.sha }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.msi
            dist/*.msi.sha256
          if-no-files-found: error
          retention-days: 7

  sanitizers:
    name: Linux — ASan and UBSan tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Read Qt version
        id: qt
        run: echo "version=$(tr -d '[:space:]' < packaging/qt_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Install build and Qt platform dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libfontconfig1-dev libdbus-1-dev \
            libxkbcommon-dev libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            patchelf dpkg-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ steps.qt.outputs.version }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          install-deps: false
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: caongan-qt${{ steps.qt.outputs.version }}-linux

      - name: Configure with sanitizers
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -O1
          LDFLAGS: -fsanitize=address,undefined
        run: >-
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          -DCAONGAN_BUILD_TESTS=ON

      - name: Build sanitizer tests
        run: cmake --build build-asan --parallel 4

      - name: Test with sanitizers
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure
